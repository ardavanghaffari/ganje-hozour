<style>
  body {
    direction: rtl;
    text-align: right;
  }

  /* Justify all paragraphs */
  #content p {
    text-align: justify;
    hyphens: auto;
  }

  /* Style poem blocks */
  .literalblock.poem .content pre {
    background-color: #ffe6cc;
    border-right: 4px solid #e67300;
  }

  .literalblock.poem .title {
    text-align: right;
  }

  /* Adjust table of contents for RTL */
  #toc ul ul {
    padding-inline-start: 1.5em;
  }

  .custom-toc {
    margin-top: 8px;
    padding-bottom: .5em;
    font-family: "Vazirmatn";
  }

  .custom-toc a {
    text-decoration: none;
    font-size: 100%;
  }

  .custom-toc ul {
    margin: 0;
    list-style-type: none;
  }

  .custom-toc li {
    margin-top: .3334em;
  }

  .custom-toc li p {
    margin: 0;
    line-height: 1.3334;
    font-size: inherit;
  }

  /* Override Open Sans in headings */
  h1,
  h2,
  h3,
  #toctitle,
  .sidebarblock>.content>.title,
  h4,
  h5,
  h6 {
    font-family: "Vazirmatn"
  }

  #toc ul {
    font-family: "Vazirmatn"
  }

  .admonitionblock>table td.icon .title {
    font-family: "Vazirmatn"
  }

  .verseblock pre {
    font-family: "Vazirmatn"
  }

  .conum[data-value] {
    font-family: "Vazirmatn"
  }

  /* Override Noto Serif in body text */
  body {
    font-family: "Vazirmatn"
  }

  .admonitionblock td.content>.title,
  .audioblock>.title,
  .exampleblock>.title,
  .imageblock>.title,
  .listingblock>.title,
  .literalblock>.title,
  .stemblock>.title,
  .openblock>.title,
  .paragraph>.title,
  .quoteblock>.title,
  table.tableblock>.title,
  .verseblock>.title,
  .videoblock>.title,
  .dlist>.title,
  .olist>.title,
  .ulist>.title,
  .qlist>.title,
  .hdlist>.title {
    font-family: "Vazirmatn"
  }

  /* Override Droid Sans Mono used in monospaced phrases and verbatim blocks */
  code {
    font-family: "Vazirmatn"
  }

  pre {
    font-family: "Vazirmatn"
  }

  kbd {
    font-family: "Vazirmatn"
  }

<style>
  body {
    direction: rtl;
    text-align: right;
  }

  /* Justify all paragraphs */
  #content p {
    text-align: justify;
    hyphens: auto;
  }

  /* Style poem blocks */
  .literalblock.poem .content pre {
    background-color: #ffe6cc;
    border-right: 4px solid #e67300;
  }

  .literalblock.poem .title {
    text-align: right;
  }

  /* Adjust table of contents for RTL */
  #toc ul ul {
    padding-inline-start: 1.5em;
  }

  .custom-toc {
    margin-top: 8px;
    padding-bottom: .5em;
    font-family: "Vazirmatn";
  }

  .custom-toc a {
    text-decoration: none;
    font-size: 100%;
  }

  .custom-toc ul {
    margin: 0;
    list-style-type: none;
  }

  .custom-toc li {
    margin-top: .3334em;
  }

  .custom-toc li p {
    margin: 0;
    line-height: 1.3334;
    font-size: inherit;
  }

  /* Override Open Sans in headings */
  h1,
  h2,
  h3,
  #toctitle,
  .sidebarblock>.content>.title,
  h4,
  h5,
  h6 {
    font-family: "Vazirmatn"
  }

  #toc ul {
    font-family: "Vazirmatn"
  }

  .admonitionblock>table td.icon .title {
    font-family: "Vazirmatn"
  }

  .verseblock pre {
    font-family: "Vazirmatn"
  }

  .conum[data-value] {
    font-family: "Vazirmatn"
  }

  /* Override Noto Serif in body text */
  body {
    font-family: "Vazirmatn"
  }

  .admonitionblock td.content>.title,
  .audioblock>.title,
  .exampleblock>.title,
  .imageblock>.title,
  .listingblock>.title,
  .literalblock>.title,
  .stemblock>.title,
  .openblock>.title,
  .paragraph>.title,
  .quoteblock>.title,
  table.tableblock>.title,
  .verseblock>.title,
  .videoblock>.title,
  .dlist>.title,
  .olist>.title,
  .ulist>.title,
  .qlist>.title,
  .hdlist>.title {
    font-family: "Vazirmatn"
  }

  /* Override Droid Sans Mono used in monospaced phrases and verbatim blocks */
  code {
    font-family: "Vazirmatn"
  }

  pre {
    font-family: "Vazirmatn"
  }

  kbd {
    font-family: "Vazirmatn"
  }

  .page-navigation {
    position: fixed;
    inset-inline-end: 1.25rem;
    bottom: 1.25rem;
    z-index: 1000;
    display: flex;
    gap: .5rem;
  }

  .page-navigation .back-to-top {
    display: none;
  }

  .page-navigation .back-to-top.is-visible {
    display: inline-flex;
  }

  .page-navigation button,
  .page-navigation a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: #e67300;
    box-shadow: 0 2px 8px rgb(0 0 0 / 25%);
    color: #fff;
    cursor: pointer;
    font: 600 .9rem "Vazirmatn", sans-serif;
    text-decoration: none;
  }

  .page-navigation svg {
    width: 1.25rem;
    height: 1.25rem;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  .page-navigation button:hover,
  .page-navigation a:hover,
  .page-navigation button:focus-visible,
  .page-navigation a:focus-visible {
    background: #b85c00;
    color: #fff;
  }

  .page-navigation button:focus-visible,
  .page-navigation a:focus-visible {
    outline: 3px solid #1a73e8;
    outline-offset: 3px;
  }

  @media (max-width: 480px) {
    .page-navigation {
      inset-inline-end: .75rem;
      bottom: .75rem;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var pathname = decodeURIComponent(window.location.pathname).replace(/\/+$/, '');
    if (pathname === '' || pathname === '/index.html') return;

    var navigation = document.createElement('nav');
    navigation.className = 'page-navigation';

    var topButton = document.createElement('button');
    topButton.type = 'button';
    topButton.className = 'back-to-top';
    topButton.innerHTML = `
      <svg viewBox="0 0 24 24">
        <path d="m18 15-6-6-6 6"/>
      </svg>
    `;
    topButton.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    var homeLink = document.createElement('a');
    homeLink.href = '/';
    homeLink.innerHTML = `
      <svg viewBox="0 0 24 24">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
    `;

    navigation.append(topButton, homeLink);
    document.body.append(navigation);

    function updateVisibility() {
      topButton.classList.toggle('is-visible', window.scrollY > 300);
    }

    window.addEventListener('scroll', updateVisibility, { passive: true });
    updateVisibility();
  });
</script>
